<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟模拟实验平台 Ultimate - VirtualLab Ultimate</title>
    <style>
        :root {
            --bg: #0a0f1a;
            --panel: #121b2d;
            --accent: #1a2a45;
            --highlight: #e94560;
            --text: #e0e0e0;
            --text2: #a0a0b0;
            --gold: #f0c060;
            --green: #4caf84;
            --blue: #4a90d9;
            --border: #2a3a55;
            --radius: 12px;
            --transition: 0.25s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #topNav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 20px;
            background: var(--panel);
            border-bottom: 2px solid var(--border);
            height: 50px;
            gap: 10px;
        }
        #topNav .logo {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
        }
        .nav-btns {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .nav-btns button {
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--accent);
            color: #ccc;
            cursor: pointer;
            font-size: 0.85em;
            transition: var(--transition);
            font-weight: 500;
        }
        .nav-btns button:hover, .nav-btns button.active {
            background: var(--highlight);
            border-color: var(--highlight);
            color: #fff;
            transform: translateY(-1px);
        }
        #userArea {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 5px 12px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: #1a1a35;
            transition: var(--transition);
            font-size: 0.85em;
        }
        #userArea:hover {
            border-color: var(--gold);
        }
        #userAvatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }
        #mainContainer {
            display: flex;
            height: calc(100vh - 50px);
            position: relative;
        }
        .page {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .page.active {
            display: flex;
        }
        #homePage {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            background: radial-gradient(ellipse at center, #15202d 0%, #0a0f1a 100%);
        }
        .home-title {
            font-size: 2.6em;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
        }
        .home-subtitle {
            color: var(--text2);
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
        }
        .home-cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .home-card {
            width: 200px;
            height: 160px;
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .home-card:hover {
            border-color: var(--highlight);
            transform: translateY(-6px);
            background: #1e2b45;
        }
        .home-card .icon {
            font-size: 2.8em;
        }
        .home-card .label {
            font-size: 1.1em;
            font-weight: 600;
        }
        #experimentPage {
            flex-direction: row;
            gap: 0;
        }
        .left-panel, .right-panel {
            background: var(--panel);
            padding: 10px;
            overflow-y: auto;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .left-panel {
            width: 280px;
            min-width: 280px;
            border-right: 2px solid var(--border);
        }
        .right-panel {
            width: 290px;
            min-width: 290px;
            border-left: 2px solid var(--border);
        }
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0f1a;
            position: relative;
        }
        #labCanvas {
            flex: 1;
            cursor: crosshair;
            border: 2px solid #2a3a55;
            border-radius: 6px;
            margin: 8px;
            background: #0d1117;
        }
        .panel-title {
            font-weight: 700;
            color: var(--gold);
            padding: 8px 12px;
            background: #1a2540;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
        }
        .panel-title:hover {
            border-color: var(--gold);
        }
        .panel-content {
            display: none;
            flex-direction: column;
            gap: 5px;
            max-height: 380px;
            overflow-y: auto;
            padding: 4px 0;
        }
        .panel-content.show {
            display: flex;
        }
        .panel-content input {
            padding: 8px 12px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: #1a2540;
            color: #fff;
            outline: none;
            font-size: 0.8em;
        }
        .item-entry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            background: #1a2540;
            border-radius: 6px;
            cursor: grab;
            font-size: 0.75em;
            border: 1px solid transparent;
            transition: var(--transition);
        }
        .item-entry:hover {
            border-color: var(--blue);
            background: #1f3050;
        }
        .item-entry .item-name {
            flex: 1;
            margin-left: 4px;
            font-weight: 500;
        }
        .item-entry .param-btn {
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold);
            cursor: pointer;
            font-size: 0.65em;
            transition: var(--transition);
        }
        .param-btn:hover {
            background: var(--gold);
            color: #000;
        }
        .env-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78em;
            flex-wrap: wrap;
        }
        .env-row label {
            min-width: 70px;
            color: #aaa;
        }
        .env-row input, .env-row select {
            flex: 1;
            min-width: 70px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #1a2540;
            color: #fff;
            font-size: 0.78em;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 6px;
            align-items: center;
        }
        .btn-primary {
            padding: 8px 16px;
            background: var(--highlight);
            border: none;
            color: #fff;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }
        .btn-stop {
            padding: 8px 16px;
            background: #555;
            border: none;
            color: #fff;
            border-radius: 18px;
            cursor: pointer;
        }
        .btn-replay {
            padding: 8px 16px;
            background: var(--blue);
            border: none;
            color: #fff;
            border-radius: 18px;
            cursor: pointer;
        }
        .btn-reset {
            padding: 8px 16px;
            background: #c0392b;
            border: none;
            color: #fff;
            border-radius: 18px;
            cursor: pointer;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #121b2d;
            border: 2px solid #2a3a55;
            border-radius: 16px;
            padding: 20px;
            max-width: 650px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            color: #ddd;
        }
        .modal h3 {
            color: var(--gold);
            margin-bottom: 12px;
        }
        .modal label {
            display: block;
            margin: 6px 0 2px;
            font-size: 0.85em;
        }
        .modal input, .modal textarea, .modal select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #1a2540;
            color: #fff;
            margin-bottom: 6px;
            resize: vertical;
            font-size: 0.85em;
        }
        .search-result-item {
            padding: 10px;
            background: #1a2540;
            border-radius: 8px;
            margin: 6px 0;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            font-size: 0.85em;
        }
        .search-result-item:hover {
            border-color: var(--blue);
            background: #1f3050;
        }
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 8px 24px;
            border-radius: 20px;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="topNav">
        <span class="logo">🧪 VirtualLab Ultimate</span>
        <div class="nav-btns">
            <button id="btnHome" class="active">🏠 主页</button>
            <button id="btnExperiment">🔬 开始实验</button>
            <button id="btnLiterature">📚 文献搜索</button>
            <button id="btnLang">🌐 语言</button>
        </div>
        <div id="userArea">
            <div id="userAvatar">?</div>
            <span id="userNameDisplay">未登录</span>
        </div>
    </div>
    <div id="mainContainer">
        <!-- 主页 -->
        <div class="page active" id="homePage">
            <div class="home-title">🔬 虚拟模拟实验平台 Ultimate</div>
            <div class="home-subtitle">从微观粒子到宏观物体，全部拖拽至试验台，模拟真实物理化学现象。</div>
            <div class="home-cards">
                <div class="home-card" id="cardExperiment"><span class="icon">🔬</span><span class="label">开始实验</span></div>
                <div class="home-card" id="cardLiterature"><span class="icon">📚</span><span class="label">文献搜索</span></div>
                <div class="home-card" id="cardLang"><span class="icon">🌐</span><span class="label">语言区</span></div>
            </div>
        </div>

        <!-- 实验页 -->
        <div class="page" id="experimentPage">
            <div class="left-panel">
                <div class="panel-title expanded">🧰 仪器与药品 <span>▼</span></div>
                <div class="panel-content show">
                    <input type="text" id="searchItems" placeholder="搜索（名称、类型、化学式）...">
                    <div id="itemsList" style="max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;"></div>
                </div>
            </div>
            <div class="center-panel">
                <canvas id="labCanvas"></canvas>
                <div class="btn-row" style="justify-content:center;flex-wrap:wrap;">
                    <button class="btn-primary" id="btnStart">▶ 开始实验</button>
                    <button class="btn-stop" id="btnStop">⏹ 终止</button>
                    <button class="btn-replay" id="btnReplay">🔄 回放</button>
                    <button class="btn-reset" id="btnReset">🗑️ 重置试验台</button>
                </div>
                <div id="speedControl" style="display:none;position:absolute;bottom:70px;right:20px;background:#121b2d;padding:6px 12px;border-radius:8px;gap:6px;align-items:center;">
                    <span>回放倍速:</span>
                    <select id="replaySpeed">
                        <option value="0.1">×0.1</option><option value="0.5">×0.5</option>
                        <option value="1.0" selected>×1.0</option><option value="2.0">×2.0</option>
                        <option value="3.0">×3.0</option>
                    </select>
                </div>
            </div>
            <div class="right-panel">
                <div class="panel-title expanded">🌡 环境参数 <span>▼</span></div>
                <div class="panel-content show">
                    <div class="env-row"><label>海拔(m)</label><input type="number" id="envAltitude" value="0"></div>
                    <div class="env-row"><label>重力(m/s²)</label><input type="number" id="envGravity" value="9.81"></div>
                    <div class="env-row"><label>气温(°C)</label><input type="number" id="envTemp" value="25"></div>
                    <div class="env-row"><label>气压(kPa)</label><input type="number" id="envPressure" value="101.325"></div>
                    <div class="env-row"><label>光照(lux)</label><input type="number" id="envLight" value="10000"></div>
                    <div class="env-row"><label>磁场强度(T)</label><input type="number" id="envMagStr" value="0.00005"></div>
                    <button class="btn-primary" id="btnSaveEnv" style="margin-top:5px;width:100%;">💾 保存环境</button>
                </div>
            </div>
        </div>

        <!-- 文献页 -->
        <div class="page" id="literaturePage">
            <div style="display:flex;flex-direction:column;padding:20px;overflow-y:auto;height:100%;gap:20px;">
                <div style="background:#121b2d;border-radius:12px;padding:20px;border:1px solid #2a3a55;">
                    <h3 style="color:#f0c060;">📝 社区贡献</h3>
                    <button class="btn-primary" id="btnRecord">记录实验</button>
                    <button class="btn-replay" id="btnQuery" style="margin-left:8px;">查询记录</button>
                </div>
                <div style="background:#121b2d;border-radius:12px;padding:20px;border:1px solid #2a3a55;">
                    <h3 style="color:#f0c060;">📖 原始资料库</h3>
                    <input type="text" id="searchOriginal" placeholder="搜索文献（名称、作者、学科...）" style="width:100%;padding:8px;border-radius:16px;border:1px solid #2a3a55;background:#1a2540;color:#fff;">
                    <div id="originalResults" style="margin-top:10px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗：参数设置 -->
    <div class="modal-overlay" id="modalParam">
        <div class="modal"><h3>⚙️ 参数设置</h3><div id="paramFields"></div><div class="btn-row"><button class="btn-stop" id="btnParamCancel">取消</button><button class="btn-primary" id="btnParamSave">保存并拖拽</button></div></div>
    </div>
    <!-- 弹窗：文献详情 -->
    <div class="modal-overlay" id="modalLiteratureDetail">
        <div class="modal"><h3 id="litDetailTitle"></h3><div id="litDetailContent"></div><button class="btn-stop" id="btnCloseLitDetail">关闭</button></div>
    </div>
    <!-- 弹窗：用户 -->
    <div class="modal-overlay" id="modalUser"><div class="modal"><h3>用户中心</h3><input placeholder="邮箱/电话" id="loginContact"><input type="password" placeholder="密码" id="loginPassword"><button class="btn-primary" id="btnLogin">登录</button><button class="btn-primary" id="btnRegister">注册</button></div></div>
    <!-- 弹窗：记录 -->
    <div class="modal-overlay" id="modalRecord"><div class="modal"><h3>记录实验</h3><input placeholder="名称" id="recName"><input placeholder="科目" id="recSubject"><textarea placeholder="操作与结果..."></textarea><button class="btn-primary" id="btnRecordStore">存储</button></div></div>
    <div class="toast" id="toast"></div>

    <script>
    (function() {
        // ---------- 全局状态 ----------
        let currentUser = null;
        let experimentRunning = false, replaying = false;
        let placedItems = [], particles = [], bubbles = [], replayData = [], replayFrame = 0, replaySpeed = 1.0;
        let waterRegion = null;
        let animationId = null, lastTime = 0;
        let envSettings = { altitude:0, gravity:9.81, temperature:25, pressure:101.325, light:10000, magStr:0.00005 };
        let paramSettings = {};
        let draggedItem = null;

        const canvas = document.getElementById('labCanvas');
        const ctx = canvas?.getContext('2d');

        function resizeCanvas() {
            if (!canvas) return;
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth - 16;
            canvas.height = parent.clientHeight - 70;
        }
        if (canvas) { resizeCanvas(); window.addEventListener('resize', resizeCanvas); }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = 'toast show';
            setTimeout(() => t.className = 'toast', 2000);
        }

        // ---------- 超全物品库 ----------
        // 微观粒子
        const microParticles = [
            { id:'electron', name:'电子', icon:'⚡', category:'微观粒子', defaultParams:{charge:-1, mass_kg:9.109e-31} },
            { id:'proton', name:'质子', icon:'🔴', category:'微观粒子', defaultParams:{charge:1, mass_kg:1.673e-27} },
            { id:'neutron', name:'中子', icon:'⚪', category:'微观粒子', defaultParams:{charge:0, mass_kg:1.675e-27} },
            { id:'photon', name:'光子', icon:'💡', category:'微观粒子', defaultParams:{energy_eV:2.0} },
            { id:'muon', name:'μ子', icon:'🌀', category:'微观粒子', defaultParams:{mass_MeV:105.7} },
            { id:'tau', name:'τ子', icon:'🌀', category:'微观粒子', defaultParams:{mass_MeV:1777} },
            { id:'quark_up', name:'上夸克', icon:'🔹', category:'微观粒子', defaultParams:{charge:2/3} },
            { id:'quark_down', name:'下夸克', icon:'🔸', category:'微观粒子', defaultParams:{charge:-1/3} },
            { id:'gluon', name:'胶子', icon:'🔗', category:'微观粒子' },
            { id:'higgs', name:'希格斯玻色子', icon:'✨', category:'微观粒子' },
        ];

        // 化学元素 (118个)
        const elements = [];
        const elementNames = [
            '氢','氦','锂','铍','硼','碳','氮','氧','氟','氖','钠','镁','铝','硅','磷','硫','氯','氩','钾','钙','钪','钛','钒','铬','锰','铁','钴','镍','铜','锌','镓','锗','砷','硒','溴','氪','铷','锶','钇','锆','铌','钼','锝','钌','铑','钯','银','镉','铟','锡','锑','碲','碘','氙','铯','钡','镧','铈','镨','钕','钷','钐','铕','钆','铽','镝','钬','铒','铥','镱','镥','铪','钽','钨','铼','锇','铱','铂','金','汞','铊','铅','铋','钋','砹','氡','钫','镭','锕','钍','镤','铀','镎','钚','镅','锔','锫','锎','锿','镄','钔','锘','铹','𬬻','𬭊','𬭳','𬭶','𫟼','鿏','𫟷','𬬭','鿔','𬬻','𬭊','𬭳','𬭶','𫟼','鿏','𫟷','𬬭','鿔','𬬻','𬭊','𬭳','𬭶','𫟼','鿏','𫟷','𬬭'
        ];
        const elementSymbols = [
            'H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr','Rb','Sr','Y','Zr','Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd','In','Sn','Sb','Te','I','Xe','Cs','Ba','La','Ce','Pr','Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu','Hf','Ta','W','Re','Os','Ir','Pt','Au','Hg','Tl','Pb','Bi','Po','At','Rn','Fr','Ra','Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf','Es','Fm','Md','No','Lr','Rf','Db','Sg','Bh','Hs','Mt','Ds','Rg','Cn','Nh','Fl','Mc','Lv','Ts','Og'
        ];
        for (let i=0; i<118; i++) {
            const name = elementNames[i] || `元素${i+1}`;
            const symbol = elementSymbols[i] || `U${i+1}`;
            elements.push({
                id: 'elem_'+symbol,
                name: `${name} (${symbol})`,
                icon: '⚛️',
                category: '化学元素',
                defaultParams: { mass_g: i*2+1, state: i<2?'gas':i<10?'solid':i<18?'solid':'solid' },
                elementData: { symbol, atomicNumber: i+1 }
            });
        }

        // 化合物
        const compounds = [
            { id:'comp_H2O', name:'水 (H₂O)', icon:'💧', category:'化合物', defaultParams:{volume_ml:200, temp_c:25} },
            { id:'comp_HCl', name:'盐酸 (HCl)', icon:'🧪', category:'化合物', defaultParams:{volume_ml:50, conc_mol:1} },
            { id:'comp_NaOH', name:'氢氧化钠 (NaOH)', icon:'🧂', category:'化合物', defaultParams:{mass_g:2} },
            { id:'comp_H2SO4', name:'硫酸 (H₂SO₄)', icon:'⚗️', category:'化合物', defaultParams:{volume_ml:30, conc_mol:2} },
            { id:'comp_NaCl', name:'氯化钠 (NaCl)', icon:'🧂', category:'化合物', defaultParams:{mass_g:5} },
            { id:'comp_C2H5OH', name:'乙醇 (C₂H₅OH)', icon:'🍶', category:'化合物', defaultParams:{volume_ml:100} },
            { id:'comp_CH3COOH', name:'乙酸 (CH₃COOH)', icon:'🧪', category:'化合物', defaultParams:{volume_ml:50} },
            { id:'comp_NaHCO3', name:'碳酸氢钠 (NaHCO₃)', icon:'🧂', category:'化合物', defaultParams:{mass_g:3} },
            { id:'comp_CaCO3', name:'碳酸钙 (CaCO₃)', icon:'🪨', category:'化合物', defaultParams:{mass_g:10} },

        function getAllItems() {
            return [
                ...microParticles,

        function renderItems(filter='') {
            const list = document.getElementById('itemsList');
            if (!list) return;
            const kw = filter.toLowerCase();
            const filtered = allItems.filter(item => 
                item.name.toLowerCase().includes(kw) || 
                item.id.toLowerCase().includes(kw) || 
                (item.category||'').toLowerCase().includes(kw)
            );
            // 简单分页显示，避免太多导致卡顿
            const maxShow = 200;
            const displayItems = filtered.slice(0, maxShow);
            list.innerHTML = displayItems.map(item => `
                <div class="item-entry" draggable="true" data-item-id="${item.id}">
                    <span>${item.icon||'📦'}</span>
                    <span class="item-name">${item.name}</span>
                    <span style="font-size:0.6em;color:#777;">${item.category||''}</span>
                    <button class="param-btn" data-id="${item.id}">⚙️</button>
                </div>
            `).join('');
            if (filtered.length > maxShow) {
                list.innerHTML += `<div style="padding:6px;color:#888;font-size:0.7em;">... 仅显示前 ${maxShow} 项，请输入更精确搜索</div>`;
            }

            list.querySelectorAll('.item-entry').forEach(entry => {
                entry.addEventListener('dragstart', e => {
                    const itemId = entry.dataset.itemId;
                    const item = allItems.find(i => i.id === itemId);
                    draggedItem = item ? JSON.parse(JSON.stringify(item)) : null;
                    if (draggedItem && paramSettings[itemId]) {
                        draggedItem.defaultParams = paramSettings[itemId];
                    }
                    e.dataTransfer.setData('text/plain', itemId);
                });
                entry.querySelector('.param-btn')?.addEventListener('click', e => {
                    e.stopPropagation();
                    openParamModal(entry.dataset.itemId);
                });
            });
        }
        document.getElementById('searchItems')?.addEventListener('input', e => renderItems(e.target.value));
        renderItems();

        function openParamModal(itemId) {
            const item = allItems.find(i => i.id === itemId);
            if (!item) return;
            const modal = document.getElementById('modalParam');
            const fields = document.getElementById('paramFields');
            const params = paramSettings[itemId] || item.defaultParams || {};
            let html = '';
            for (let [key, val] of Object.entries(params)) {
                const type = typeof val === 'number' ? 'number' : 'text';
                html += `<label>${key}</label><input type="${type}" value="${val}" data-key="${key}">`;
            }
            fields.innerHTML = html;
            modal._itemId = itemId;
            modal.classList.add('show');
        }

                params[inp.dataset.key] = inp.type==='number' ? parseFloat(inp.value)||0 : inp.value;

        // ---------- 重置试验台 ----------
        function resetLab() {
            placedItems = [];
            particles = [];
            bubbles = [];
            waterRegion = null;
            replayData = [];
            replayFrame = 0;
            experimentRunning = false;
            replaying = false;
            document.getElementById('speedControl').style.display = 'none';
            drawLab();
            showToast('试验台已重置');
        }
        document.getElementById('btnReset')?.addEventListener('click', resetLab);

        // ---------- 试验台拖放与绘制 ----------
        if (canvas) {
            canvas.addEventListener('dragover', e => e.preventDefault());
            canvas.addEventListener('drop', e => {
                e.preventDefault();
                if (!draggedItem) return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                const params = draggedItem.defaultParams || {};
                const newItem = {
                    id: Date.now().toString(36)+Math.random().toString(36).substr(2,4),
                    typeId: draggedItem.id,
                    name: params._label || draggedItem.name,
                    category: draggedItem.category,
                    x, y,
                    params: {...params},
                    vx:0, vy:0, 
                    mass: params.mass_kg || (params.mass_g||1)/1000 || 0.1,
                    size: 25,
                    state: 'placed',
                    elementData: draggedItem.elementData,
                    compoundData: draggedItem.compoundData,
                    isSodium: draggedItem.elementData?.symbol === 'Na',
                };
                if (draggedItem.id === 'comp_H2O') {
                    newItem.isWater = true;
                    newItem.volume = params.volume_ml || 200;
                    newItem.mass = newItem.volume / 1000;
                    newItem.size = Math.sqrt(newItem.volume)*5;
                    waterRegion = { x, y, w: newItem.size*2, h: newItem.size, volume: newItem.volume };
                }
                if (newItem.isSodium) {
                    newItem.mass = (params.mass_g||1)/1000;
                    newItem.size = Math.max(8, Math.cbrt(newItem.mass*1e6)*2);
                }
                placedItems.push(newItem);
                drawLab();
                showToast(`已放置: ${newItem.name}`);
                draggedItem = null;
            });
        }

        function drawLab() {
            if (!ctx || !canvas) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            // 网格
            ctx.strokeStyle = '#1a2330';
            ctx.lineWidth = 0.5;
            for (let x=0; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for (let y=0; y<canvas.height; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
            // 水域
            if (waterRegion) {
                ctx.fillStyle = 'rgba(50,120,200,0.5)';
                ctx.fillRect(waterRegion.x-waterRegion.w/2, waterRegion.y-waterRegion.h/2, waterRegion.w, waterRegion.h);
                ctx.strokeStyle = 'rgba(100,180,240,0.8)';
                ctx.lineWidth = 2;
                ctx.strokeRect(waterRegion.x-waterRegion.w/2, waterRegion.y-waterRegion.h/2, waterRegion.w, waterRegion.h);
            }
            // 粒子与气泡
            particles.forEach(p => {
                ctx.fillStyle = p.color || '#ffaa00';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size||3, 0, Math.PI*2); ctx.fill();
            });
            bubbles.forEach(b => {
                ctx.strokeStyle = '#aaddff'; ctx.lineWidth=1;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.size||4, 0, Math.PI*2); ctx.stroke();
            });
            // 物品绘制
            placedItems.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                if (item.isSodium) {
                    const remain = 1 - (item.dissolved||0);
                    const r = item.size * Math.max(0.1, remain);
                    ctx.shadowColor = item.state==='reacting' ? '#ff6600' : 'transparent';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#c0c0c0';
                    ctx.beginPath(); ctx.arc(0,0, r, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath(); ctx.arc(-r*0.3, -r*0.3, r*0.4, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (item.typeId === 'thermometer') {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-4, -25, 8, 50);
                    const temp = envSettings.temperature + (item.reactionHeat||0)*10;
                    const mercuryH = Math.min(35, Math.max(5, (temp+10)*0.5));
                    ctx.fillStyle = '#ff3333';
                    ctx.fillRect(-3, 20-mercuryH, 6, mercuryH);
                } else if (item.category === '微观粒子') {
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath(); ctx.arc(0,0, 6, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth=1;
                    ctx.beginPath(); ctx.arc(0,0, 8, 0, Math.PI*2); ctx.stroke();
                } else if (item.category === '交通工具' || item.category === '建筑' || item.category === '自然物体' || item.category === '日常物品' || item.category === '电子产品') {
                    ctx.fillStyle = '#556677';
                    ctx.fillRect(-15, -10, 30, 20);
                    ctx.strokeStyle = '#334455';
                    ctx.strokeRect(-15, -10, 30, 20);
                } else {
                    ctx.fillStyle = '#8899aa';
                    ctx.beginPath(); ctx.arc(0,0, item.size||20, 0, Math.PI*2); ctx.fill();
                }
                ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(item.name||'', 0, - (item.size||20) -6);
                ctx.restore();
            });
            // 环境文字
            ctx.fillStyle = '#aaa'; ctx.font = '10px monospace'; ctx.textAlign = 'left';
            ctx.fillText(`T:${envSettings.temperature.toFixed(1)}°C g:${envSettings.gravity} P:${envSettings.pressure}kPa`, 10, canvas.height-10);
        }

        // ---------- 模拟引擎 ----------
        function updateSim(dt) {
            dt = Math.min(dt, 0.05);
            placedItems.forEach(item => {
                if (item.isSodium && item.state==='reacting' && waterRegion && item.dissolved<1) {
                    const waterTop = waterRegion.y - waterRegion.h/2;
                    item.y = waterTop - item.size*0.3;
                    const force = (1-item.dissolved)*180;
                    item.vx += (Math.random()-0.5)*force*dt;
                    item.vy += (Math.random()-0.5)*force*0.6*dt;
                    item.vx *= 0.88; item.vy *= 0.88;
                    item.x += item.vx*dt*50;
                    if (item.x<waterRegion.x-waterRegion.w/2+10) item.vx*=-0.7;
                    if (item.x>waterRegion.x+waterRegion.w/2-10) item.vx*=-0.7;
                    item.dissolved += dt*0.35;
                    if (item.dissolved>1) item.dissolved=1;
                    envSettings.temperature += dt * item.mass * 25;
                    if (Math.random()<0.8) bubbles.push({x:item.x+Math.random()*12-6, y:item.y-10, size:4+Math.random()*8, vy:-50-Math.random()*60, life:1});
                    if (item.mass>0.5 && Math.random()<0.25) {
                        particles.push({x:item.x, y:item.y, size:2+Math.random()*5, vx:(Math.random()-0.5)*80, vy:-40-Math.random()*60, life:0.5, color:'#ff5500'});
                    }
                    if (item.mass>1 && item.dissolved>0.5 && Math.random()<0.04) {
                        for (let i=0;i<8;i++) particles.push({x:item.x, y:item.y, size:4+Math.random()*7, vx:(Math.random()-0.5)*150, vy:-60-Math.random()*100, life:0.9, color:'#ff8800'});
                        showToast('💥 钠块剧烈反应！');
                    }
                }
                // 酸碱中和
                if (item.compoundData?.formula==='HCl' || item.compoundData?.formula==='H2SO4') {
                    const bases = placedItems.filter(i => i.compoundData?.formula==='NaOH');
                    bases.forEach(b => {
                        const dist = Math.sqrt((item.x-b.x)**2 + (item.y-b.y)**2);
                        if (dist < 60) {
                            envSettings.temperature += dt * 8;
                            if (Math.random()<0.15) particles.push({x:(item.x+b.x)/2, y:(item.y+b.y)/2, size:3, vx:0, vy:-15, life:0.6, color:'#ffffff'});
                        }
                    });
                }
            });
            // 粒子与气泡运动
            particles.forEach(p => { p.x+=(p.vx||0)*dt; p.y+=(p.vy||0)*dt; p.vy += envSettings.gravity*dt*5; p.life-=dt; });
            particles = particles.filter(p => p.life>0);
            bubbles.forEach(b => { b.x+=(b.vx||0)*dt; b.y+=(b.vy||0)*dt; b.life-=dt; });
            bubbles = bubbles.filter(b => b.life>0);
            // 温度回归
            if (!experimentRunning) envSettings.temperature += (25 - envSettings.temperature) * dt * 0.3;
        }

        function gameLoop(ts) {
            if (!lastTime) lastTime = ts;
            let dt = (ts - lastTime)/1000;
            if (dt<=0) dt=0.016; if (dt>0.1) dt=0.1;
            lastTime = ts;
            if (experimentRunning && !replaying) {
                updateSim(dt);
                drawLab();
            } else if (replaying && replayData.length) {
                replayFrame += dt * replaySpeed;
                const idx = Math.min(Math.floor(replayFrame*60), replayData.length-1);
                const frame = replayData[idx];
                if (frame) {
                    placedItems = frame.placedItems; particles = frame.particles; bubbles = frame.bubbles;
                    waterRegion = frame.waterRegion;
                    envSettings.temperature = frame.temperature;
                    drawLab();
                }
                if (replayFrame*60 >= replayData.length) stopReplay();
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        document.getElementById('btnStart')?.addEventListener('click', ()=>{
            if (experimentRunning) return;
            experimentRunning = true; replayData=[];
            placedItems.forEach(item => { if (item.isSodium && waterRegion) item.state='reacting'; });
            showToast('实验开始');
        });
        document.getElementById('btnStop')?.addEventListener('click', ()=>{
            experimentRunning = false; showToast('实验终止');
            placedItems.forEach(i => { if (i.state==='reacting') i.state='paused'; });
        });
        document.getElementById('btnReplay')?.addEventListener('click', ()=>{
            if (replaying) stopReplay();
            else {
                if (replayData.length===0) { showToast('无回放数据'); return; }
                replaying = true; replayFrame=0;
                replaySpeed = parseFloat(document.getElementById('replaySpeed')?.value||'1');
                document.getElementById('speedControl').style.display='flex';
            }
        });

            { title:'物种起源', author:'Charles Darwin', nation:'英国', subject:'生物学', year:1859, text:'提出自然选择学说，进化论奠基之作，详细论证了物种演化的机制。' },
            { title:'梦溪笔谈', author:'沈括', nation:'中国', subject:'综合', year:1088, text:'中国古代百科全书式著作，涉及天文、地理、物理、化学、生物等多学科内容。' },
            { title:'相对论', author:'Albert Einstein', nation:'德国', subject:'物理学', year:1916, text:'包含狭义与广义相对论，彻底改变了人类对时空和引力的认知。' },

        function loadOriginalResults(keyword='') {

                el.addEventListener('click', () => {

        // 页面切换
        function switchPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btns button').forEach(b => b.classList.remove('active'));
            if (id==='homePage') document.getElementById('btnHome').classList.add('active');
            if (id==='experimentPage') document.getElementById('btnExperiment').classList.add('active');
            if (id==='literaturePage') document.getElementById('btnLiterature').classList.add('active');
        }
        document.getElementById('btnHome').addEventListener('click', ()=> switchPage('homePage'));
        document.getElementById('btnExperiment').addEventListener('click', ()=> switchPage('experimentPage'));
        document.getElementById('btnLiterature').addEventListener('click', ()=> switchPage('literaturePage'));
        document.getElementById('cardExperiment')?.addEventListener('click', ()=> switchPage('experimentPage'));
        document.getElementById('cardLiterature')?.addEventListener('click', ()=> switchPage('literaturePage'));

        // 用户模拟
        document.getElementById('btnLogin')?.addEventListener('click', ()=>{
            currentUser = { name: 'Researcher', contact: 'user@lab.com' };
            document.getElementById('userNameDisplay').textContent = 'Researcher';
            document.getElementById('modalUser').classList.remove('show');
            showToast('已登录');
        });
        document.getElementById('userArea')?.addEventListener('click', ()=> document.getElementById('modalUser').classList.add('show'));

        // 环境保存
        document.getElementById('btnSaveEnv')?.addEventListener('click', ()=>{
            envSettings.altitude = parseFloat(document.getElementById('envAltitude').value)||0;
            envSettings.gravity = parseFloat(document.getElementById('envGravity').value)||9.81;
            envSettings.temperature = parseFloat(document.getElementById('envTemp').value)||25;
            envSettings.pressure = parseFloat(document.getElementById('envPressure').value)||101.325;
            envSettings.light = parseFloat(document.getElementById('envLight').value)||10000;
            envSettings.magStr = parseFloat(document.getElementById('envMagStr').value)||0.00005;
            showToast('环境参数已保存');
        });

        // 启动循环
        resizeCanvas();
        drawLab();
        lastTime = performance.now();
        animationId = requestAnimationFrame(gameLoop);

        // 关闭弹窗的全局事件
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('show');
        });
    })();
    </script>
</body>
</html>
